name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: chmod +x gradlew
      - run: ./gradlew mobile:assembleDebug -PTARGET_ABI=arm64
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "mobile/build/outputs/apk/**/*.apk"
